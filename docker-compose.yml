services:
  localstack:
    image: localstack/localstack:latest
    container_name: livros-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,s3,ec2
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    env_file: .env
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
  terraform:
    image: hashicorp/terraform:1.13.5
    working_dir: /infra
    volumes:
      - ./terraform:/infra
    env_file: .env

volumes:
  localstack_data:
